# ─────────────────────────────────────────────────────────────
# application-prod.properties  —  EC2 / Production profile
# Run with:  java -jar app.jar --spring.profiles.active=prod
# All secrets come from environment variables / IAM role
# ─────────────────────────────────────────────────────────────

# RDS endpoint injected via env var DB_HOST
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:food_delivery}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.hikari.maximum-pool-size=20

# No SQL logging in prod
spring.jpa.show-sql=false

# Safer DDL in prod — validate schema, don't auto-alter
spring.jpa.hibernate.ddl-auto=update

# Actuator — expose health for ALB health checks
management.endpoint.health.show-details=always

# Minimal logging in prod
logging.level.com.fooddelivery=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.org.springframework=WARN
