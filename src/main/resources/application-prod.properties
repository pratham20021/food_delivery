# application-prod.properties — EC2 Production
# All values injected via /home/ec2-user/food-delivery.env

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:food_delivery}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

management.endpoint.health.show-details=always

logging.level.com.fooddelivery=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.org.springframework=WARN
