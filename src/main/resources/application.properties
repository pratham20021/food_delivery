# ─────────────────────────────────────────────────────────────
# application.properties  —  BASE config (all profiles inherit)
# Override sensitive values via environment variables or
# profile-specific files (application-local.properties, etc.)
# ─────────────────────────────────────────────────────────────

# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:food_delivery}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=86400000

# AWS — credentials (blank = use IAM role on EC2)
aws.region=${AWS_REGION:us-east-1}
aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}

# AWS SNS
aws.sns.topic.arn=${SNS_TOPIC_ARN:}
aws.sns.notification.email=${SNS_EMAIL:}

# AWS SES
aws.ses.from.email=${SES_FROM_EMAIL:}

# AWS SQS
aws.sqs.order.queue.url=${SQS_ORDER_QUEUE_URL:}

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Actuator health endpoint (used by EC2 / load balancer)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.fooddelivery=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.auth=ERROR
