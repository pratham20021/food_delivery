# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=86400000

# AWS SNS
aws.region=${AWS_REGION:us-east-1}
aws.sns.topic.arn=${SNS_TOPIC_ARN:arn:aws:sns:us-east-1:123456789012:food-delivery-notifications}

# Logging
logging.level.com.fooddelivery=INFO
logging.level.software.amazon.awssdk=WARN
