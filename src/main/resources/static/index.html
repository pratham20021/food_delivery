<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodDash - Food Delivery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

        /* NAV */
        nav { background: #e74c3c; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        nav h1 { font-size: 1.5rem; }
        nav .nav-links { display: flex; gap: 1rem; align-items: center; }
        nav button { background: white; color: #e74c3c; border: none; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-weight: 600; }
        nav button:hover { background: #ffeaea; }
        #user-info { font-size: 0.9rem; }

        /* PAGES */
        .page { display: none; padding: 2rem; max-width: 1100px; margin: 0 auto; }
        .page.active { display: block; }

        /* AUTH */
        .auth-container { max-width: 420px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .auth-container h2 { text-align: center; margin-bottom: 1.5rem; color: #e74c3c; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #e74c3c; }
        .btn-primary { width: 100%; background: #e74c3c; color: white; border: none; padding: 0.75rem; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .btn-primary:hover { background: #c0392b; }
        .auth-switch { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        .auth-switch a { color: #e74c3c; cursor: pointer; text-decoration: underline; }

        /* RESTAURANTS */
        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-4px); }
        .card-img { width: 100%; height: 160px; background: linear-gradient(135deg, #e74c3c, #f39c12); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .card-body { padding: 1rem; }
        .card-body h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
        .card-body p { color: #777; font-size: 0.85rem; }
        .badge { display: inline-block; background: #ffeaea; color: #e74c3c; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-top: 0.5rem; }
        .rating { color: #f39c12; font-weight: 600; font-size: 0.9rem; }

        /* MENU */
        .back-btn { background: none; border: 1px solid #e74c3c; color: #e74c3c; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .back-btn:hover { background: #ffeaea; }
        .menu-item { background: white; border-radius: 10px; padding: 1rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
        .menu-item-info h4 { font-size: 1rem; margin-bottom: 0.2rem; }
        .menu-item-info p { color: #777; font-size: 0.82rem; }
        .menu-item-price { font-weight: 700; color: #e74c3c; font-size: 1rem; }
        .add-btn { background: #e74c3c; color: white; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; margin-left: 1rem; }
        .add-btn:hover { background: #c0392b; }

        /* CART */
        .cart-sidebar { position: fixed; right: 0; top: 0; height: 100%; width: 320px; background: white; box-shadow: -4px 0 20px rgba(0,0,0,0.15); padding: 1.5rem; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s; z-index: 1000; }
        .cart-sidebar.open { transform: translateX(0); }
        .cart-sidebar h3 { margin-bottom: 1rem; color: #2c3e50; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
        .cart-total { font-weight: 700; font-size: 1.1rem; margin: 1rem 0; }
        .cart-btn { position: fixed; bottom: 2rem; right: 2rem; background: #e74c3c; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 30px; cursor: pointer; font-size: 1rem; font-weight: 600; box-shadow: 0 4px 15px rgba(231,76,60,0.4); z-index: 999; }
        .delivery-input { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }

        /* ORDERS */
        .order-card { background: white; border-radius: 10px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 1px 8px rgba(0,0,0,0.07); }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
        .status-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-ORDER_RECEIVED { background: #fff3cd; color: #856404; }
        .status-PREPARING { background: #cff4fc; color: #055160; }
        .status-OUT_FOR_DELIVERY { background: #d1ecf1; color: #0c5460; }
        .status-DELIVERED { background: #d4edda; color: #155724; }

        /* PROGRESS */
        .progress-bar { display: flex; justify-content: space-between; margin: 1rem 0; position: relative; }
        .progress-bar::before { content: ''; position: absolute; top: 12px; left: 0; right: 0; height: 3px; background: #eee; z-index: 0; }
        .progress-step { display: flex; flex-direction: column; align-items: center; z-index: 1; flex: 1; }
        .step-dot { width: 24px; height: 24px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; margin-bottom: 0.3rem; }
        .step-dot.done { background: #e74c3c; color: white; }
        .step-label { font-size: 0.65rem; color: #777; text-align: center; }

        /* ALERT */
        .alert { padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert-error { background: #ffeaea; color: #c0392b; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        .loading { text-align: center; padding: 3rem; color: #777; }
    </style>
</head>
<body>

<nav>
    <h1>🍔 FoodDash</h1>
    <div class="nav-links">
        <span id="user-info"></span>
        <button id="orders-btn" onclick="showOrders()" style="display:none">My Orders</button>
        <button id="logout-btn" onclick="logout()" style="display:none">Logout</button>
    </div>
</nav>

<!-- AUTH PAGE -->
<div id="auth-page" class="page active">
    <div class="auth-container">
        <h2 id="auth-title">Login</h2>
        <div id="auth-alert"></div>
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div id="name-group" class="form-group" style="display:none">
                <label>Full Name</label>
                <input type="text" id="auth-name" placeholder="John Doe">
            </div>
            <div id="phone-group" class="form-group" style="display:none">
                <label>Phone</label>
                <input type="tel" id="auth-phone" placeholder="+1234567890">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="auth-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="auth-submit">Login</button>
        </form>
        <div class="auth-switch">
            <span id="auth-switch-text">Don't have an account? </span>
            <a onclick="toggleAuthMode()">Register</a>
        </div>
    </div>
</div>

<!-- RESTAURANTS PAGE -->
<div id="restaurants-page" class="page">
    <h2 class="section-title">🏪 Restaurants Near You</h2>
    <div id="restaurants-grid" class="grid"><div class="loading">Loading restaurants...</div></div>
</div>

<!-- MENU PAGE -->
<div id="menu-page" class="page">
    <button class="back-btn" onclick="showRestaurants()">← Back to Restaurants</button>
    <h2 class="section-title" id="menu-title">Menu</h2>
    <div id="menu-list"></div>
</div>

<!-- ORDERS PAGE -->
<div id="orders-page" class="page">
    <button class="back-btn" onclick="showRestaurants()">← Back to Restaurants</button>
    <h2 class="section-title">📦 My Orders</h2>
    <div id="orders-list"><div class="loading">Loading orders...</div></div>
</div>

<!-- CART SIDEBAR -->
<div id="cart-sidebar" class="cart-sidebar">
    <h3>🛒 Your Cart</h3>
    <div id="cart-items-list"></div>
    <div class="cart-total" id="cart-total">Total: $0.00</div>
    <input type="text" class="delivery-input" id="delivery-address" placeholder="Delivery address...">
    <button class="btn-primary" onclick="placeOrder()">Place Order</button>
    <br><br>
    <button style="width:100%;background:#eee;border:none;padding:0.6rem;border-radius:8px;cursor:pointer" onclick="toggleCart()">Close</button>
</div>

<button class="cart-btn" id="cart-btn" onclick="toggleCart()" style="display:none">🛒 Cart (<span id="cart-count">0</span>)</button>

<script>
    const API = '/api';
    let token = localStorage.getItem('token');
    let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    let cart = [];
    let currentRestaurantId = null;
    let isRegister = false;

    // ─── INIT ───────────────────────────────────────────────────────────────────
    window.onload = () => {
        if (token && currentUser) {
            showRestaurants();
            updateNavUI();
        }
    };

    function updateNavUI() {
        document.getElementById('user-info').textContent = `Hi, ${currentUser?.name || ''}`;
        document.getElementById('orders-btn').style.display = 'inline-block';
        document.getElementById('logout-btn').style.display = 'inline-block';
        document.getElementById('cart-btn').style.display = 'inline-block';
    }

    // ─── AUTH ────────────────────────────────────────────────────────────────────
    function toggleAuthMode() {
        isRegister = !isRegister;
        document.getElementById('auth-title').textContent = isRegister ? 'Register' : 'Login';
        document.getElementById('auth-submit').textContent = isRegister ? 'Register' : 'Login';
        document.getElementById('name-group').style.display = isRegister ? 'block' : 'none';
        document.getElementById('phone-group').style.display = isRegister ? 'block' : 'none';
        document.getElementById('auth-switch-text').textContent = isRegister ? 'Already have an account? ' : "Don't have an account? ";
        document.querySelector('.auth-switch a').textContent = isRegister ? 'Login' : 'Register';
        document.getElementById('auth-alert').innerHTML = '';
    }

    async function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const alertEl = document.getElementById('auth-alert');

        try {
            let body = { email, password };
            let url = `${API}/auth/login`;
            if (isRegister) {
                body.name = document.getElementById('auth-name').value;
                body.phone = document.getElementById('auth-phone').value;
                url = `${API}/auth/register`;
            }
            const res = await apiFetch(url, 'POST', body, false);
            token = res.data.token;
            currentUser = { name: res.data.name, email: res.data.email };
            localStorage.setItem('token', token);
            localStorage.setItem('user', JSON.stringify(currentUser));
            updateNavUI();
            showRestaurants();
        } catch (err) {
            alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        }
    }

    function logout() {
        token = null; currentUser = null; cart = [];
        localStorage.removeItem('token'); localStorage.removeItem('user');
        document.getElementById('user-info').textContent = '';
        document.getElementById('orders-btn').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'none';
        document.getElementById('cart-btn').style.display = 'none';
        showPage('auth-page');
    }

    // ─── RESTAURANTS ─────────────────────────────────────────────────────────────
    async function showRestaurants() {
        showPage('restaurants-page');
        const grid = document.getElementById('restaurants-grid');
        grid.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const res = await apiFetch(`${API}/restaurants`);
            const emojis = ['🍕', '🍔', '🍣', '🌮', '🍜', '🥗'];
            grid.innerHTML = res.data.map((r, i) => `
                <div class="card" onclick="showMenu(${r.id}, '${r.name}')">
                    <div class="card-img">${emojis[i % emojis.length]}</div>
                    <div class="card-body">
                        <h3>${r.name}</h3>
                        <p>${r.address}</p>
                        <span class="badge">${r.cuisine}</span>
                        <span class="rating" style="float:right">⭐ ${r.rating}</span>
                    </div>
                </div>`).join('');
        } catch (err) {
            grid.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        }
    }

    // ─── MENU ─────────────────────────────────────────────────────────────────────
    async function showMenu(restaurantId, name) {
        currentRestaurantId = restaurantId;
        cart = [];
        updateCartUI();
        showPage('menu-page');
        document.getElementById('menu-title').textContent = `🍽️ ${name}`;
        const list = document.getElementById('menu-list');
        list.innerHTML = '<div class="loading">Loading menu...</div>';
        try {
            const res = await apiFetch(`${API}/restaurants/${restaurantId}/menu`);
            list.innerHTML = res.data.map(item => `
                <div class="menu-item">
                    <div class="menu-item-info">
                        <h4>${item.name}</h4>
                        <p>${item.description}</p>
                        <small style="color:#aaa">${item.category}</small>
                    </div>
                    <div style="display:flex;align-items:center">
                        <span class="menu-item-price">$${item.price.toFixed(2)}</span>
                        <button class="add-btn" onclick="addToCart(${item.id}, '${item.name}', ${item.price})">+</button>
                    </div>
                </div>`).join('');
        } catch (err) {
            list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        }
    }

    // ─── CART ─────────────────────────────────────────────────────────────────────
    function addToCart(id, name, price) {
        const existing = cart.find(i => i.menuItemId === id);
        if (existing) existing.quantity++;
        else cart.push({ menuItemId: id, name, price, quantity: 1 });
        updateCartUI();
    }

    function updateCartUI() {
        const count = cart.reduce((s, i) => s + i.quantity, 0);
        const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        document.getElementById('cart-count').textContent = count;
        document.getElementById('cart-total').textContent = `Total: $${total.toFixed(2)}`;
        document.getElementById('cart-items-list').innerHTML = cart.map(i => `
            <div class="cart-item">
                <span>${i.name} x${i.quantity}</span>
                <span>$${(i.price * i.quantity).toFixed(2)}</span>
            </div>`).join('') || '<p style="color:#aaa;font-size:0.9rem">Cart is empty</p>';
    }

    function toggleCart() {
        document.getElementById('cart-sidebar').classList.toggle('open');
    }

    async function placeOrder() {
        if (cart.length === 0) return alert('Add items to cart first!');
        const address = document.getElementById('delivery-address').value.trim();
        if (!address) return alert('Please enter delivery address');
        try {
            const res = await apiFetch(`${API}/orders`, 'POST', {
                restaurantId: currentRestaurantId,
                items: cart.map(i => ({ menuItemId: i.menuItemId, quantity: i.quantity })),
                deliveryAddress: address
            });
            cart = [];
            updateCartUI();
            toggleCart();
            alert(`✅ Order #${res.data.id} placed! You'll receive email notifications for each status update.`);
            showOrders();
        } catch (err) {
            alert('Error: ' + err.message);
        }
    }

    // ─── ORDERS ───────────────────────────────────────────────────────────────────
    async function showOrders() {
        showPage('orders-page');
        const list = document.getElementById('orders-list');
        list.innerHTML = '<div class="loading">Loading orders...</div>';
        try {
            const res = await apiFetch(`${API}/orders`);
            if (res.data.length === 0) {
                list.innerHTML = '<p style="color:#777">No orders yet. Start ordering!</p>';
                return;
            }
            const steps = ['ORDER_RECEIVED', 'PREPARING', 'OUT_FOR_DELIVERY', 'DELIVERED'];
            const stepLabels = ['Received', 'Preparing', 'On Way', 'Delivered'];
            list.innerHTML = res.data.map(o => {
                const stepIdx = steps.indexOf(o.status);
                const progressHtml = steps.map((s, i) => `
                    <div class="progress-step">
                        <div class="step-dot ${i <= stepIdx ? 'done' : ''}">${i <= stepIdx ? '✓' : i + 1}</div>
                        <div class="step-label">${stepLabels[i]}</div>
                    </div>`).join('');
                return `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <strong>Order #${o.id}</strong>
                            <span style="color:#777;font-size:0.85rem;margin-left:0.5rem">${o.restaurant.name}</span>
                        </div>
                        <span class="status-badge status-${o.status}">${o.status.replace(/_/g, ' ')}</span>
                    </div>
                    <div class="progress-bar">${progressHtml}</div>
                    <div style="font-size:0.85rem;color:#555">
                        ${o.items.map(i => `${i.menuItem.name} x${i.quantity}`).join(', ')}
                    </div>
                    <div style="font-weight:700;margin-top:0.5rem;color:#e74c3c">$${o.totalAmount.toFixed(2)}</div>
                </div>`;
            }).join('');
        } catch (err) {
            list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        }
    }

    // ─── HELPERS ──────────────────────────────────────────────────────────────────
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function apiFetch(url, method = 'GET', body = null, auth = true) {
        const headers = { 'Content-Type': 'application/json' };
        if (auth && token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || 'Request failed');
        return data;
    }
</script>
</body>
</html>
