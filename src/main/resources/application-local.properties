# ─────────────────────────────────────────────────────────────
# application-local.properties  —  Local development profile
# Run with:  java -jar app.jar --spring.profiles.active=local
# Or set env var:  SPRING_PROFILES_ACTIVE=local
# ─────────────────────────────────────────────────────────────

# Show SQL in console during local dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Verbose logging locally
logging.level.com.fooddelivery=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.software.amazon.awssdk=INFO
